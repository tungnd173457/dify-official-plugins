identity:
  name: get_project_documents
  author: tungnd
  label:
    en_US: Get Project Documents

description:
  human:
    en_US: Use this tool to retrieve all document types and their details (document name, character count, summary) for a specific project in a dataset
  llm: Use this tool to retrieve all document types and their details (document name, character count, summary) for a specific project in a dataset.

parameters:
  - name: project_name
    type: string
    required: true
    label:
      en_US: Project Name
    human_description:
      en_US: The name of the project to retrieve documents for (e.g., "2025.Red Bull Tết")
    llm_description: The name of the project to retrieve documents for (e.g., "2025.Red Bull Tết")
    form: llm

  - name: dataset_id
    type: string
    required: true
    label:
      en_US: Dataset ID
    human_description:
      en_US: >-
        The ID of the Dataset containing the project.
        You can find this ID in the URL of each Dataset page (/datasets/<dataset_id>).
    form: form
    default: ""

extra:
  python:
    source: tools/get_project_documents/get_project_documents.py
